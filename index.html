<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140d0a" />
    <meta name="description" content="KURIO — marketplace de NFTs: descubra, colecione e compre arte digital verificada de criadores emergentes e consagrados." />
    <meta property="og:title" content="KURIO — Seja dono do futuro da arte digital" />
    <meta property="og:description" content="Descubra NFTs selecionados, apoie artistas e tenha uma parte da cultura da internet." />
    <meta property="og:type" content="website" />
    <link rel="preload" as="image" type="image/webp" href="/assets/nfts/emerald-ape-1-960.webp" imagesrcset="/assets/nfts/emerald-ape-1-240.webp 240w, /assets/nfts/emerald-ape-1-480.webp 480w, /assets/nfts/emerald-ape-1-960.webp 960w" imagesizes="(min-width: 1024px) 450px, 42vw" fetchpriority="high" />
    <title>KURIO — Marketplace de NFTs</title>
  </head>
  <body>
    <div id="root">
      <main id="app-loading" class="container-site pt-8" aria-busy="true" aria-label="Carregando KURIO">
        <div class="skeleton h-5 w-24 rounded-[4px]" aria-hidden="true"></div>
        <div class="mt-10 grid grid-cols-[1fr_120px] items-center gap-4 md:grid-cols-[3fr_2fr] md:gap-10" aria-hidden="true">
          <div class="space-y-3">
            <div class="skeleton h-6 w-4/5 rounded-[4px] md:h-10"></div>
            <div class="skeleton h-6 w-full rounded-[4px] md:h-10"></div>
            <div class="skeleton h-4 w-2/3 rounded-[4px]"></div>
          </div>
          <div class="skeleton aspect-square w-full rounded-[16px]"></div>
        </div>
      </main>
      <div id="app-load-error" class="container-site pt-8" role="alert" hidden>
        <p>Não foi possível abrir a KURIO.</p>
        <a href="" class="mt-3 inline-block text-accent-strong underline">Tentar novamente</a>
      </div>
    </div>
    <noscript><style>#app-loading { display: none; }</style>A KURIO precisa de JavaScript habilitado para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
